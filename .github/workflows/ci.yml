name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PKG_CONFIG_PATH: ${{ github.workspace }}/.native/install/lib/pkgconfig
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libssl-dev pkg-config
      - name: Build patched libtorrent 2.1.2
        run: |
          mkdir -p .native
          curl --fail --location --retry 3 -o .native/c-ares.tar.gz \
            https://github.com/c-ares/c-ares/releases/download/v1.34.8/c-ares-1.34.8.tar.gz
          curl --fail --location --retry 3 -o .native/libtorrent.tar.gz \
            https://github.com/arvidn/libtorrent/releases/download/v2.1.2/libtorrent-rasterbar-2.1.2.tar.gz
          sha256sum --check <<'CHECKSUMS'
          c222b6d681096f9444d2c4863d2c1174019e27cacca0a4a5c114d36dd7d7bf78  .native/c-ares.tar.gz
          3362546d9cd71b9e49ee6cac7d3f1f914ce9cdb217c86b63d5b22cbed0334dbc  .native/libtorrent.tar.gz
          CHECKSUMS
          mkdir -p .native/c-ares-src .native/libtorrent-src
          tar -xzf .native/c-ares.tar.gz -C .native/c-ares-src --strip-components=1
          tar -xzf .native/libtorrent.tar.gz -C .native/libtorrent-src --strip-components=1
          cmake -S .native/c-ares-src -B .native/c-ares-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/.native/c-ares" \
            -DCARES_SHARED=OFF -DCARES_STATIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build .native/c-ares-build --target install
          for patch in strict-interface bound-dns routed-http darwin-routes; do
            patch -d .native/libtorrent-src -p1 -i "$PWD/native/libtorrent-$patch.patch"
          done
          cmake -S .native/libtorrent-src -B .native/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/.native/install" \
            -DCMAKE_PREFIX_PATH="$PWD/.native/c-ares" -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -Dwebtorrent=OFF
          cmake --build .native/build --target install
      - name: Test engine and persistence
        run: cargo +stable test --locked --no-default-features
