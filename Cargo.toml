[package]
name = "fero"
version = "0.1.0"
edition = "2024"
description = "A native BitTorrent client for everyday downloads and large libraries"
license = "MIT"
repository = "https://github.com/dedyrahmat/fero"
readme = "readme.md"

[features]
default = ["desktop"]
desktop = [
    "dep:dirs", "dep:gpui", "dep:unicode-segmentation", "dep:tray-icon",
    "dep:base64", "dep:ring", "dep:subtle", "dep:rustls", "dep:rustls-pemfile",
    "dep:tokio-rustls", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util",
    "dep:plist", "dep:image",
]

[dependencies]
anyhow = "1"
cxx = "1"
dirs = { version = "6", optional = true }
gpui = { version = "=0.2.2", features = ["runtime_shaders"], optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"] }
unicode-segmentation = { version = "1", optional = true }
url = "2"
roxmltree = "0.20"
chrono = "0.4"

base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }
subtle = { version = "2.6", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, optional = true }

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"

[[bin]]
name = "fero"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
sha1_smol = "1"
sha2 = "0.10"
tempfile = "3"
